name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            install: sudo apt-get update && sudo apt-get install -y libusb-1.0-0-dev pkg-config
          - runner: ubuntu-24.04-arm
            install: sudo apt-get update && sudo apt-get install -y libusb-1.0-0-dev pkg-config
          - runner: macos-14
            install: brew install libusb pkg-config
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: ${{ matrix.install }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: make validate

  package:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0-dev pkg-config
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - run: cargo publish --dry-run
