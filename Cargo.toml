[package]
name = "secugen-hu20-rs"
version = "0.1.2"
edition = "2021"
rust-version = "1.71"
description = "Pure Rust userspace USB driver for the SecuGen Hamster Pro 20 (HU20) fingerprint scanner."
license = "MIT"
readme = "README.md"
repository = "https://github.com/faeliaso/secugen-hu20-rs"
homepage = "https://github.com/faeliaso/secugen-hu20-rs"
documentation = "https://docs.rs/secugen-hu20-rs"
keywords = ["fingerprint", "usb", "secugen", "hu20"]
categories = ["hardware-support"]

[lib]
name = "secugen_hu20_rs"

[dependencies]
png = "0.17"
rusb = "0.9"
thiserror = "1.0"
